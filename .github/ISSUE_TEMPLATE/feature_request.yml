name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 这个建议解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案
    validations:
      required: false
