name: Bug 报告
description: 报告一个问题帮助我们改进
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "浏览器 / Node 版本 / 操作系统"
    validations:
      required: false
